# 加页手记地图工具 — 配置
# 路径 / 常量 / 阈值全部外置；代码从本文件读，禁止再焊死。

[paths]
map_library    = "D:/Pictures/20260818摸金地图"   # 28种子×2楼层参考图（素材/答案地图）
shot_library   = "D:/Videos/NVIDIA/IdentityV"     # 游戏截图测试样本
assets          = "assets"                         # 项目内素材根（图标模板 + 入口引索）
icon_template  = "assets/_icon_entrance.png"       # 白箭头入口图标模板
nav_template   = "assets/ui_nav_column.png"        # 侧栏导航列模板（地图开合判据，见 vision.NAV_BAND）
entrance_index = "assets/entrance_index"           # 入口引索裁图 + _index.json
captures        = "captures"                       # 运行时截图 + log.csv（gitignore）
eval_inbox      = "eval/inbox"                      # 用户手动纠正的失败样本回收

[panel]
# 基准分辨率与固定面板坐标（等比外推的基准，也是该分辨率下的精确值）。
# 多分辨率适配：同 16:9 分辨率按 W/1920 等比外推；其它分辨率在下表校准后可用；
# 未校准的非 16:9 → 拒绝并提示（panel_for_screen 返回 None）。
# 动态检测（雾块/暗块连通块）已实测证伪：雾态下面板边缘不可见、雾块 bbox 随探明漂移。
resolution = [1920, 1080]
rect = [668, 166, 1064, 569]   # x, y, w, h

# 每分辨率校准表（可选）。键 "宽x高"，值 [x, y, w, h]。
# 真实非 16:9（或外推不准的）分辨率截图到位后，用标注量出面板填入即覆盖外推值。
# [panel.rects]
# "2560x1440" = [891, 221, 1419, 759]
# "3440x1440" = [1198, 221, 1909, 759]

[vision]
fog_bgr = [58, 47, 37]   # 迷雾色 BGR：冷色不是中性灰！暖度 -21，会被 classify_region 误判成通路(cls=3)
fog_tol = 24             # 颜色距离阈值，剔除迷雾

[match]
# ── 两层各有一个「分」，都「越小越好」，但量纲不同、各配各的闸（别互相套用）──
#   入口层 = 1 − 墙双向覆盖率      （只比几何不比色块，见 CLAUDE.md 技术备忘②）
#   对齐层 = 错配率（不一致像素的加权占比 ∈[0,1]）
# 旧口径「类号平方差」sqdiff 与入口层「5 类错配率」class 已于 2026-09-16 删除：前者惩罚
# =(类号差)²，路(cls3)↔黑(cls0) 罚 9、房↔路只罚 1，纯属编号巧合 —— 实机真对齐下类别一致率
# 87~92%，可 4.4~6.1% 的离群像素吃掉 69~95% 的总分 ⇒ 正确对齐算成 0.473~2.560 永远过不了闸；
# 且"缩到最小尺度躲进均匀区"能骗低分 ⇒ 全搜恒钉尺度下界。回滚请走 git。
score_confident = 0.45   # 入口置信闸：入口分<此值 且 overlap≥overlap_min ⇒ 种子ID可信。
                          # 墙重合口径实测真种子分 0.146/0.169/0.170/0.221/0.388/0.440。
align_score_max = 0.30   # 对齐显示闸：投影重合分<此值 且 overlap≥overlap_min ⇒ 才显示投影。
                          # 2026-09-17 由 0.25 放宽到 0.30：真值入表后实测，172012/180442 两张
                          # **种子判对**的只因分 0.263/0.282 被藏图；这批里放宽不放进任何新的错图
                          # （3 张错图的分反而只有 0.124）。⚠️ 注意这个闸**挡不住错种子**——错种子
                          # 的对齐分一样漂亮，它只判"几何放得下"。种子对不对由入口置信闸负责。
overlap_min     = 0.40   # 二次闸（两层共用）：防小模板/小掩膜侥幸低分。
                          # 对齐层 overlap = 探明像素经逆变换后落在参考图真实内容上的比例。
icon_k_ref = 0.44        # 图标当尺子·棘轮基准：图标检测尺度k高于此值才放大裁样（k≤此值保持
                           # 基线half=102px，8月全部基线数据k∈[0.40,0.45]零扰动；只放大不缩小——
                           # 缩小会丢信息让小模板假获胜，17.13实测k=0.40纯ruler缩到186px即翻错种子）。
                           # 游戏默认档k≈1.0→half≈232，世界覆盖回到8月水平（s与裁框无关，
                           # 缩放只能靠ruler救，扩大取样梯子无效）。half上限min(pw,ph)//2防裁样超引索引域
anchor_pin = true        # 图标锚定：样本图标↔引索图标重合后**钉死平移**，只搜尺度。
                           # 入口层与对齐层共用（对齐层走 hint_icon）。依据 experiments/e5_anchor_ab.py
                           # 2×2 实测：引索窗口放大到 2× 后全搜会炸（主集 top-1 3/3→2/3、控制组低分
                           # 确信 1→5），锚定抹平回 3/3 与 1，控制组真种子排名 7~24 名→1~7 名。
                           # 置 false ⇒ 入口层全体弃权（墙重合必须有锚点）；对齐层退回全搜。
fog_dilate = 5           # 渐变迷雾剔除：纯雾色(FOG_BGR tol24)的膨胀核宽，0=关。渐变段与雾核相邻，
                           # 膨胀一并剔。该掩膜现只服务于下面 sample_mask_min 这张快速失败闸。
sample_mask_min = 0.20   # 快速失败闸：样本结构(墙/房/通路，已剔雾)占比低于此值 ⇒ 提示"周围未探明"、
                           # 不跑匹配。实测(2026-09-11,雾膨胀后): 坏样本全部≤15.6%, 好样本全部≥24.7%。
                           # ⚠️ 它与入口排序口径**不是一回事**：它量的是"非雾面积"，墙重合度量只需墙像素。
                           # 2026-09-16 实机 12 张实测：被判拒的样本仍含 581~1348 个墙像素，且把框放大
                           # 2.5× 结构占比只动 ±2 个点（15%→17%）⇒ 拒绝的原因是那片区域本身稀，
                           # 不是框太小。是否按口径分流见 CLAUDE.md 待办。
dominant_cls_max = 0.90  # 单类占比闸：mask内最大单类占比超过此值=入口周围是单一均匀区(大片走廊/
                           # 房间/雾) ⇒ 触发扩大取样梯子(0.25→0.32, 只在仍退化时降档,首个非退化即停)。
                           # 注意: 0.32档可能把并列翻成错误种子假干净(实测144715@0.32翻成种子18)，
                           # 故非退化即停、不主动升档
lead_min = 0.25          # **结构闸的逃生门**：样本结构不足 sample_mask_min 时，若入口 top1 相对
                           # top2 的领先幅度 ≥ 此值，仍放行（领先 = (top2−top1)/top2，分越小越好）。
                           # 依据 experiments/e34_evidence_gate.py（44 张主集实测）：结构占比只是
                           # 「能不能判」的**代理**，而入口层判的是**墙**（被拒样本里仍含 581~1348
                           # 个墙像素）⇒ 直接用入口层自己的领先幅度更对症。
                           # 支配现状的档：领先≥0.25 → **出图且对 14→21（+7），出图但错仍是 3 张
                           # 没多**；领先≥0.20 开始多 1 张错的；领先≥0.15 崩（错 3→10）。故取 0.25。
                           # 只有一个结果（无次名可比）按 1.0 处理，与 e34 口径一致。
