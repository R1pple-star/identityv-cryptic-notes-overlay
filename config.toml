# 加页手记地图工具 — 配置
# 路径 / 常量 / 阈值全部外置；代码从本文件读，禁止再焊死。

[paths]
map_library    = "D:/Pictures/20260818摸金地图"   # 28种子×2楼层参考图（素材/答案地图）
shot_library   = "D:/Videos/NVIDIA/IdentityV"     # 游戏截图测试样本
assets          = "assets"                         # 项目内素材根（图标模板 + 入口引索）
icon_template  = "assets/_icon_entrance.png"       # 白箭头入口图标模板
entrance_index = "assets/entrance_index"           # 入口引索裁图 + _index.json
captures        = "captures"                       # 运行时截图 + log.csv（gitignore）
eval_inbox      = "eval/inbox"                      # 用户手动纠正的失败样本回收

[panel]
# 固定面板坐标（1920×1080 兜底/初值）；多分辨率由 detect_fog_panel 动态检测（待做，见 UI与流程改造计划.md 阶段C）
resolution = [1920, 1080]
rect = [668, 166, 1064, 569]   # x, y, w, h

[vision]
fog_bgr = [58, 47, 37]   # 迷雾色 BGR：冷色不是中性灰！暖度 -21，会被 classify_region 误判成通路(cls=3)
fog_tol = 24             # 颜色距离阈值，剔除迷雾

[match]
score_confident = 0.10   # 入口置信闸：入口分<0.10 且 overlap≥overlap_min 才算种子ID可信
align_score_max = 0.30   # 对齐显示闸：投影重合分<0.30 且 overlap≥overlap_min 才显示投影（与入口置信闸目的不同，两闸并存）
overlap_min     = 0.40   # 二次闸，防小模板/小掩膜侥幸低分
scale_lo  = 0.4          # 种子匹配尺度下界
scale_hi  = 1.0          # 种子匹配尺度上界（对齐域 ALIGN_SCALES 0.4-1.5）
scale_step = 0.05        # 别改粗！粗档会擦肩真实尺度→大模板错位、分虚高
fog_dilate    = 5        # 渐变迷雾剔除：纯雾色(FOG_BGR tol24)的膨胀核宽，0=关。渐变段与雾核相邻，膨胀一并剔
room_weight   = 1.0      # 房间(cls2)权重。实测保持1.0：任何偏离(2.0/0.5、1.5/1.0、1.0/0.75)都把
                           # 17.13 翻给种子16——样本里房间仅~6%，加权后小房间块独挑大梁反而误导
passage_weight = 1.0     # 通路(cls3)权重。同上保持1.0：通路承载几何结构，降权=丢结构
sample_mask_min = 0.20   # 快速失败闸：样本mask结构占比低于此值直接提示"周围未探明"不跑匹配
                           # 实测(2026-09-11,雾膨胀后): 坏样本全部≤15.6%, 好样本全部≥24.7%, 阈值取空带正中
